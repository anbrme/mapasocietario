# api-directo.ncdata.eu — direct-to-VPS fallback for the BORME API
#
# Belongs on the ncdata-bormes-impl box, alongside the existing server block
# for rag.ncdata.eu. Kept here because that repo is not reachable from the
# environment this was written in; move it there when convenient.
#
# WHY THIS EXISTS
# Under the LaLiga court order the Spanish ISPs null-route individual
# Cloudflare anycast addresses during matches, and the live path to this API
# crosses Cloudflare twice:
#
#   browser -> api.ncdata.eu (api-proxy Worker) -> rag.ncdata.eu (CF) -> nginx -> Flask
#
# Either hop going dark takes the API down for Spanish users. This server
# block is the third door: a hostname on the VPS's own dedicated address,
# which is not in the shared pool LaLiga blocks. The frontend reaches for it
# automatically via resilientFetch (src/services/originFailover.js in the
# mapasocietario repo) once the primary stops answering.
#
# DNS: an A record for api-directo.ncdata.eu to this box's address, proxy
# OFF (grey cloud). Orange-clouding it would put it straight back into the
# blocked pool and defeat the entire exercise.
#
# Certificate:
#   certbot --nginx -d api-directo.ncdata.eu
#
# WHAT THIS TRADES AWAY — read before deploying
# Grey-clouding publishes this box's real address, so the fallback has no
# Cloudflare WAF, no DDoS absorption, and does not run the Worker's
# search-analytics-guard. The BORME endpoints carry no auth of their own
# (api-proxy/src/index.js:1927 removes it deliberately), so on this hostname
# they are exposed with only the rate limits below in front of them. That is
# an accepted cost for a fallback, not a design to move the primary onto:
# keep api.ncdata.eu orange-clouded and let the failover choose.

# --- Rate limiting -----------------------------------------------------
# Partial replacement for what Cloudflare and the Worker's analytics guard
# provide on the primary path. These two directives belong in the http{}
# block (nginx.conf), NOT here inside server{}:
#
#   limit_req_zone  $binary_remote_addr zone=api_directo:10m rate=10r/s;
#   limit_conn_zone $binary_remote_addr zone=api_directo_conn:10m;

# --- CORS allowlist ----------------------------------------------------
# Mirrors ALLOWED_ORIGINS in api-proxy/src/index.js:43. The Worker echoes the
# request's Origin when it is on the list; nginx has no array type, so a map
# does the same job. An unlisted origin maps to the empty string, which makes
# add_header emit nothing at all and the browser refuse the response — which
# is the behaviour we want.
#
# Also belongs in the http{} block.
#
#   map $http_origin $cors_allow_origin {
#       default                             "";
#       "https://mapasocietario.es"         $http_origin;
#       "https://www.mapasocietario.es"     $http_origin;
#       "https://analysis.ncdata.eu"        $http_origin;
#       "https://canvas.ncdata.eu"          $http_origin;
#       "http://localhost:5173"             $http_origin;
#       "http://localhost:5174"             $http_origin;
#   }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-directo.ncdata.eu;

    # certbot manages these lines.
    ssl_certificate     /etc/letsencrypt/live/api-directo.ncdata.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-directo.ncdata.eu/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # A DD report PDF is the largest thing that crosses this path.
    client_max_body_size 25m;

    access_log /var/log/nginx/api-directo.access.log;
    error_log  /var/log/nginx/api-directo.error.log;

    location / {
        limit_req  zone=api_directo burst=20 nodelay;
        limit_conn api_directo_conn 20;

        # Flask (gunicorn) — same upstream the rag.ncdata.eu block proxies to.
        # Bound to loopback so this server block stays the only way in.
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # A cold BORME query is genuinely slow. The client gives an origin it
        # has heard from up to 45s before it calls it blocked and fails over,
        # so anything shorter here turns a slow answer into a phantom outage.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # If flask-cors is enabled upstream, its headers and the ones below
        # would both arrive and the browser rejects a response carrying two
        # Access-Control-Allow-Origin values. Drop whatever the app sends and
        # let this block be the single source of truth.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        # `always` matters: without it nginx omits these on 4xx/5xx, and the
        # browser then reports a CORS failure instead of the actual error,
        # which is a miserable thing to debug at 22:00 on a Saturday.
        add_header Access-Control-Allow-Origin      $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true"            always;
        add_header Vary                             "Origin"          always;

        # Preflight. X-Admin-Token is listed because the admin surfaces
        # (CnmvReviewTab, EnrichmentReviewTab, MonitoringTab) send it and
        # Flask is what validates it.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_allow_origin always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Content-Type, X-API-Key, X-Admin-Token, Authorization" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age           "86400" always;
            add_header Content-Length                   "0";
            add_header Content-Type                     "text/plain";
            return 204;
        }
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api-directo.ncdata.eu;
    return 301 https://$host$request_uri;
}
