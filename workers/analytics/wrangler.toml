name = "mapasocietario-analytics"
main = "src/index.js"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

# Persist fetch and scheduled-handler logs so a failed cron can be diagnosed
# after the live tail has disconnected.
[observability]
enabled = true
head_sampling_rate = 1

# Friday 14:30 UTC. That is 16:30 Madrid in summer (CEST) and 15:30 in winter
# (CET) — cron is always UTC, it does not follow DST. The pull deliberately
# runs ~30 min before the Claude task reads it.
[triggers]
crons = ["30 14 * * 5"]

# Reuses the existing mapasocietario D1 instance; the worker creates and owns
# its own `analytics_weekly` table and touches nothing else in there.
[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "mapasocietario-seo"
database_id = "2e471c22-6478-4d55-b3c6-9d0fc279e6ba"

[vars]
# Fill this in after running /discover. Numeric GA4 property id, NOT the
# G-XXXXXXXX measurement id.
GA_PROPERTY_ID = "530829482"

# Where the cron mails the styled weekly report. The FROM domain must be
# onboarded onto Cloudflare Email Sending (ncdata.eu already is — the same
# domain functions/feedback.js sends from in production).
REPORT_EMAIL_FROM = "analytics@ncdata.eu"
REPORT_EMAIL_TO = "mapasocietario@ncdata.eu"

# Secrets (set via `wrangler secret put`, never in this file):
#   GA_SA_KEY        - the full service account JSON, pasted as one blob
#   REPORT_TOKEN     - random string; required as ?token= on every endpoint
#   CLOUDFLARE_EMAIL_API_TOKEN - Cloudflare API token with Email Sending write.
#                      Same name and same token as the Pages project uses for
#                      functions/feedback.js; one token serves both. OPTIONAL:
#                      without it the cron still pulls, persists and serves the
#                      styled report at /report, and logs that mail was skipped.
