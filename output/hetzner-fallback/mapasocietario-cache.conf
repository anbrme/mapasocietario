# /etc/nginx/conf.d/mapasocietario-cache.conf  (http context)
#
# Page cache for the mapasocietario.es front. The Pages Function renders a
# company page in 0.4-1.1 s (two upstream API calls plus templating) and
# nothing between the visitor and the Function stores the result: Cloudflare
# does not cache Pages Function responses. Googlebot's crawl capacity follows
# the host's response time, so every fetch paying the full render is what
# doubled the average response time in the crawl stats.
#
# Lifetime comes from the Function (X-Accel-Expires; 0 = never store), so
# private badge previews and curated misses are never held here. The nightly
# warmer (mapasocietario-cache-warm.timer) renders every sitemap URL after
# the daily enrichment, so a first fetch is a hit too.
proxy_cache_path /var/cache/nginx/mapa levels=1:2 keys_zone=mapa_pages:64m
                 max_size=4g inactive=3d use_temp_path=off;

# Store only the public, anonymous pages. Everything else (app, API proxy,
# admin, verification flows, anything with a query string) goes straight to
# the upstream and is never written to disk.
map $request_uri $mapa_nocache {
    default                                   1;
    ~^/empresa/[^?]+$                         0;
    ~^/en/company/[^?]+$                      0;
    ~^/directorio(/[^?]*)?$                   0;
    ~^/sitemap[^?]*\.xml$                     0;
}
