# /etc/nginx/sites-available/mapasocietario
# Public front for mapasocietario.es on Hetzner (LaLiga-window IP blocks).
# Proxies to the Cloudflare Pages deployment by its stable pages.dev name.
# Never point this at the custom domain: that would loop back here.

server {
    listen 80;
    listen [::]:80;
    server_name mapasocietario.es www.mapasocietario.es;

    # HTTP-01 fallback for certbot (webroot mode).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://mapasocietario.es$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mapasocietario.es;

    ssl_certificate     /etc/letsencrypt/live/mapasocietario.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mapasocietario.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://mapasocietario.es$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mapasocietario.es;

    ssl_certificate     /etc/letsencrypt/live/mapasocietario.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mapasocietario.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:mapa_ssl:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;
    access_log /var/log/nginx/mapasocietario_access.log;
    error_log  /var/log/nginx/mapasocietario_error.log;

    # Re-resolve the upstream at runtime; Pages IPs rotate.
    resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
    resolver_timeout 5s;
    set $upstream mapasocietario.pages.dev;

    # Per-visitor throttle (zone defined in /etc/nginx/conf.d/mapasocietario-limits.conf).
    limit_req zone=mapa_req burst=80 nodelay;
    limit_conn mapa_conn 40;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        proxy_pass https://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $upstream;

        proxy_ssl_server_name on;
        proxy_ssl_name $upstream;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_session_reuse on;

        # Visitor identity. Pages Functions see CF-Connecting-IP = this server;
        # X-Forwarded-For carries the real visitor (overwritten, never appended).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # X-Front-Secret: lets Pages Functions trust X-Forwarded-For (root-only file).
        include /etc/nginx/snippets/mapasocietario-front-secret.conf;

        # Stop browsers upgrading to HTTP/3 against Cloudflare's own IPs.
        proxy_hide_header Alt-Svc;
        # Any upstream redirect to the pages.dev name comes back as our name.
        proxy_redirect https://mapasocietario.pages.dev/ https://mapasocietario.es/;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
