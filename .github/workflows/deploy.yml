name: Deploy to Cloudflare Pages

# Runs on pull requests as well as pushes, and this is the point: with a
# push-only trigger a PR got no checks at all, so it sat looking permanently
# "stuck on checks" while the tests had in fact never run. The first time they
# ran was after merge, inside the deploy job — which is how a broken test
# reached main and then failed the production deploy 31 seconds later instead
# of blocking the merge.
#
# Pull requests build and test but never deploy (see the deploy step's `if`).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Back-to-back commits previously launched overlapping builds, each running the
# same live API validation suite. Keep only the newest production deployment so
# an older commit cannot overload the API or deploy after a newer one. Keyed by
# ref so a PR's builds cancel each other without ever cancelling production.
concurrency:
  group: mapasocietario-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 went end-of-life in April 2026. 24 is the active LTS, and
          # local development already runs on 26, so the code is known to
          # tolerate newer runtimes. Tests and build both run before the deploy
          # step, so a regression fails the job rather than shipping.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          # Mirror origins used when LaLiga's match-day IP blocks null-route
          # the Cloudflare address a service resolves to. Repo *variables*,
          # not secrets — these are public hostnames that end up in the
          # bundle, and there is nothing to hide in them. Unset, the app
          # behaves exactly as it did before the failover landed.
          # See docs/laliga-ip-blocks.md.
          VITE_API_FALLBACK_URLS: ${{ vars.VITE_API_FALLBACK_URLS }}
          VITE_PAYMENTS_FALLBACK_URLS: ${{ vars.VITE_PAYMENTS_FALLBACK_URLS }}
          VITE_AI_INVESTIGATION_FALLBACK_URLS: ${{ vars.VITE_AI_INVESTIGATION_FALLBACK_URLS }}
          VITE_RAG_FALLBACK_URLS: ${{ vars.VITE_RAG_FALLBACK_URLS }}
          VITE_CONGRESO_PROXY_FALLBACK_URLS: ${{ vars.VITE_CONGRESO_PROXY_FALLBACK_URLS }}
          VITE_IBEX35_API_FALLBACK_URLS: ${{ vars.VITE_IBEX35_API_FALLBACK_URLS }}

      - name: Deploy to Cloudflare Pages
        # Only a push to main publishes. A pull request stops after the build,
        # which is all we want from it: proof the branch compiles and passes
        # before anyone merges it.
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=mapasocietario
